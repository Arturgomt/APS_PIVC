[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-pivc-processamento"
version = "0.2.0"
description = "Captura, qualidade e alinhamento SFace da APS PIVC UNIP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.2", "opencv-python==4.13.0.92"]

[tool.setuptools.packages.find]
include = ["processamento_imagens*", "exemplos*"]
